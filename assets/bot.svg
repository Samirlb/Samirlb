<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" role="img" aria-label="divider">
  <!-- shadow -->
  <ellipse cx="60" cy="92" rx="26" ry="5" fill="#38bdf8" opacity="0.12">
    <animate attributeName="rx" values="26;20;26" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.06;0.12" dur="2.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- bobbing bot -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>

    <!-- antenna -->
    <rect x="58" y="8" width="4" height="11" rx="2" fill="#475a6b"/>
    <circle cx="60" cy="7" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <rect x="32" y="18" width="56" height="42" rx="10" fill="#16202b" stroke="#38bdf8" stroke-width="2"/>

    <!-- eyes (blink) -->
    <g fill="#38bdf8">
      <rect x="44" y="33" width="9" height="11" rx="2"/>
      <rect x="67" y="33" width="9" height="11" rx="2"/>
      <animate attributeName="opacity" values="1;1;1;0.1;1;1" keyTimes="0;0.45;0.5;0.55;0.6;1" dur="3.4s" repeatCount="indefinite"/>
    </g>

    <!-- mouth -->
    <rect x="50" y="50" width="20" height="3" rx="1.5" fill="#0e7490"/>

    <!-- body -->
    <rect x="40" y="62" width="40" height="20" rx="6" fill="#16202b" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="52" y="68" width="16" height="3" rx="1.5" fill="#38bdf8" opacity="0.7"/>

    <!-- arms -->
    <rect x="26" y="64" width="10" height="4" rx="2" fill="#475a6b"/>
    <rect x="84" y="64" width="10" height="4" rx="2" fill="#475a6b"/>
  </g>
</svg>
